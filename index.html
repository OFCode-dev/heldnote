<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heldnote — local-first notes with version history</title>
  <meta name="description" content="Write freely. Return anytime. Local-first notes with version history.">
  <script>
    // Apply the stored theme before first paint to avoid a flash.
    try {
      const theme = localStorage.getItem('heldnote-theme');
      if (theme === 'dark' || theme === 'light') {
        document.documentElement.dataset.theme = theme;
      }
    } catch (e) { /* storage may be blocked; system preference applies */ }
  </script>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect x='2' y='3' width='32' height='22' rx='2' fill='%234E7A62' stroke='%2378A98D' stroke-width='1.5'/%3E%3Crect x='4' y='5' width='28' height='18' rx='1' fill='%230E1116'/%3E%3Cline x1='7' y1='10' x2='24' y2='10' stroke='%239FC7AE' stroke-width='1.2' stroke-linecap='round'/%3E%3Cline x1='7' y1='13.5' x2='22' y2='13.5' stroke='%239FC7AE' stroke-width='1.2' stroke-linecap='round'/%3E%3Cline x1='7' y1='17' x2='19' y2='17' stroke='%239FC7AE' stroke-width='1.2' stroke-linecap='round'/%3E%3Crect x='19.5' y='15.5' width='1.2' height='3' fill='%2378A98D'/%3E%3Crect x='15' y='25' width='6' height='4' fill='%234E7A62'/%3E%3Crect x='11' y='29' width='14' height='2.5' rx='1' fill='%234E7A62'/%3E%3C/svg%3E">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="theme-color" content="#0E1116">
  <meta property="og:title" content="Heldnote">
  <meta property="og:description" content="Write freely. Return anytime. Local-first notes with version history.">
  <meta property="og:url" content="https://heldnote.app">
  <meta property="og:image" content="https://heldnote.app/icon-512.png">
</head>
<body>
  <div id="app">
    <div id="app-notices" aria-live="polite"></div>
    <aside id="notes-panel"></aside>
    <main id="editor-panel"></main>
    <aside id="history-panel" hidden></aside>
    <footer id="status-bar">
      <span id="status-revision">—</span>
      <span id="status-retention">—</span>
      <span id="status-notice" hidden></span>
      <span id="status-counts"></span>
    </footer>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
