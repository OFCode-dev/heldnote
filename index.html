<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heldnote — local-first notes with version history</title>
  <meta name="description" content="Write freely. Return anytime. Local-first notes with version history.">
  <script>
    // Apply the stored theme before first paint to avoid a flash.
    try {
      const theme = localStorage.getItem('heldnote-theme');
      if (theme === 'dark' || theme === 'light') {
        document.documentElement.dataset.theme = theme;
      }
    } catch (e) { /* storage may be blocked; system preference applies */ }
  </script>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="theme-color" content="#0E1116">
  <meta property="og:title" content="Heldnote">
  <meta property="og:description" content="Write freely. Return anytime. Local-first notes with version history.">
  <meta property="og:url" content="https://heldnote.app">
  <meta property="og:image" content="https://heldnote.app/icon-512.png">
</head>
<body>
  <div id="app">
    <div id="app-notices" aria-live="polite"></div>
    <aside id="notes-panel"></aside>
    <main id="editor-panel"></main>
    <aside id="history-panel" hidden></aside>
    <footer id="status-bar">
      <span id="status-revision">—</span>
      <span id="status-retention">—</span>
      <span id="status-notice" hidden></span>
      <span id="status-counts"></span>
    </footer>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
