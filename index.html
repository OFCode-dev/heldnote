<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heldnote — local-first notes with version history</title>
  <meta name="description" content="A local-first browser notepad that keeps every version of every note. No account, no server — notes stay in your own browser storage.">
  <link rel="canonical" href="https://heldnote.app/">
  <script>
    // Apply the stored theme and writing face before first paint to avoid a
    // flash. editor.js owns the font preference; this only mirrors it early,
    // so a monospace note does not paint in serif and then reflow.
    try {
      const theme = localStorage.getItem('heldnote-theme');
      if (theme === 'dark' || theme === 'light') {
        document.documentElement.dataset.theme = theme;
      }
      if (localStorage.getItem('heldnote-editor-font') === 'mono') {
        document.documentElement.dataset.editorFont = 'mono';
      }
    } catch (e) { /* storage may be blocked; system preference applies */ }
  </script>

  <!-- Structured data. Two jobs: let a search engine render a rich result, and
       give an answer engine something exact to quote when someone asks for "a
       notepad that keeps old versions without an account". Every claim here is
       one the app actually keeps — featureList is not a wishlist, and the
       author block exists because the person behind the tool was hard to find.
       Deliberately absent: any offline-capability claim. There is no service
       worker yet, so the app is not guaranteed to open without a network. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Heldnote",
    "url": "https://heldnote.app/",
    "description": "A local-first browser notepad that keeps every version of every note. Notes are stored in the browser's own IndexedDB storage, with no account, no server and no third-party dependencies. Version history lets any earlier state of a note be restored, and backups go to a file or the user's own Google Drive.",
    "applicationCategory": "ProductivityApplication",
    "applicationSubCategory": "Note-taking",
    "operatingSystem": "Any (modern web browser)",
    "browserRequirements": "Requires JavaScript and IndexedDB.",
    "isAccessibleForFree": true,
    "inLanguage": ["en", "tr"],
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "featureList": [
      "Local-first storage — notes stay in the browser, never sent to a server",
      "Version history for every note, with restore",
      "No account and no sign-up",
      "Serif or monospace writing font, for prose or for ASCII diagrams and tables",
      "Full-text search across notes, plus find and replace",
      "Trash with undo",
      "Export and import a JSON backup, or back up to your own Google Drive",
      "Light and dark theme",
      "Dependency-free: no build step, no framework, no analytics"
    ],
    "softwareHelp": "https://heldnote.app/about",
    "sameAs": "https://github.com/OFCode-dev/heldnote",
    "author": {
      "@type": "Person",
      "name": "Ömer Faruk Bayrak",
      "sameAs": "https://github.com/OFCode-dev"
    }
  }
  </script>
</head>
<body>
  <!-- The app shell below is empty until app.js runs, so this document has no
       prose of its own. That is a real gap for anything that reads the page
       without executing scripts — a crawler, an answer engine, a text browser,
       or a visitor with JS disabled, who would otherwise see a blank cream
       page and no explanation. /about carries the full description. -->
  <noscript>
    <div id="noscript-note">
      <h1>Heldnote — local-first notes with version history</h1>
      <p>Heldnote is a browser notepad that keeps every version of every note. Notes are stored in your own browser, with no account and no server. It needs JavaScript to run, because the notes live in the browser's IndexedDB storage rather than on a server.</p>
      <p><a href="/about">Read what Heldnote does</a> · <a href="https://github.com/OFCode-dev/heldnote">Source on GitHub</a></p>
    </div>
  </noscript>
  <div id="app">
    <div id="app-notices" aria-live="polite"></div>
    <aside id="notes-panel"></aside>
    <main id="editor-panel"></main>
    <aside id="history-panel" hidden></aside>
    <footer id="status-bar">
      <span id="status-revision"></span>
      <span id="status-retention"></span>
      <span id="status-notice" role="status" aria-live="polite" aria-atomic="true" hidden></span>
      <span id="status-counts"></span>
      <!-- The save state, for assistive technology only. #status-revision
           cannot carry the live region itself: its visible text ends in a
           timestamp that changes on every flush, so a screen reader would
           re-announce "Saved locally" continuously while someone types. app.js
           writes the bare state phrase here, and only when it changes. Cursor
           position and word count are deliberately never announced. -->
      <span id="status-a11y" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>
    </footer>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
